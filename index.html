<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ולד & אלכסנדרה — אישור הגעה</title>
<meta name="description" content="אישור הגעה לחתונה של ולד ואלכסנדרה — 14 באוקטובר 2026, דרזנר, פתח תקווה.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300;400;500;700&family=Heebo:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2b3a2e;
    --ink-soft:#5c6b58;
    --sage:#7a8a6f;
    --gold:#b08d4f;
    --gold-soft:#c9ad74;
    --leaf:#8fa07d;
    --pink:#d08a92;
    --paper:#faf7ef;
    --paper-line:rgba(120,130,105,.28);
    --field:#fffdf8;
    --yes:#5f7d5a;
    --no:#bd8a7f;
    --page-bg:#e9e4d6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:'Heebo',sans-serif;
    color:var(--ink);
    line-height:1.55;
    -webkit-font-smoothing:antialiased;

    /* ===== שימו כאן את הרקע שלכם ===== */
    background:var(--page-bg);
    /* לדוגמה: background:url('images/wedding-bg.jpg') center/cover fixed; */

    min-height:100vh;
    padding:22px 16px;
    display:flex;justify-content:center;align-items:flex-start;
  }

  .card{
    width:100%;max-width:520px;
    background:rgba(250,247,239,.93);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    border:1px solid var(--paper-line);
    border-radius:2px;
    box-shadow:0 20px 60px rgba(40,50,35,.22);
    position:relative;overflow:hidden;
  }
  .card::before{
    content:'';position:absolute;inset:9px;
    border:1px solid rgba(176,141,79,.35);
    border-radius:1px;pointer-events:none;
  }
  .pad{padding:30px 34px 28px}
  @media(max-width:480px){.pad{padding:26px 22px 24px}}

  .crest{text-align:center;color:var(--leaf);font-size:1.15rem;line-height:1;margin-bottom:10px;letter-spacing:.1em}
  .crest .sm{font-size:.85rem;color:var(--gold)}

  .eyebrow{text-align:center;font-family:'Frank Ruhl Libre',serif;font-weight:300;font-style:italic;font-size:.95rem;color:var(--sage)}

  .of{text-align:center;font-family:'Frank Ruhl Libre',serif;font-weight:300;font-size:1rem;color:var(--ink-soft);margin-top:12px}

  /* names on one line */
  .names{
    text-align:center;font-family:'Frank Ruhl Libre',serif;color:var(--ink);
    margin-top:2px;line-height:1.1;
    display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:nowrap;
    white-space:nowrap;
  }
  .names .n{font-size:clamp(1.7rem,7vw,2.6rem);font-weight:500}
  .names .amp{font-size:clamp(1.4rem,5vw,2rem);color:var(--gold);font-weight:300}

  .meta{text-align:center;margin-top:12px;color:var(--ink-soft);font-family:'Frank Ruhl Libre',serif;font-size:1rem}
  .meta .dot{display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--gold);vertical-align:middle;margin:0 8px}
  .heart{text-align:center;color:var(--pink);margin-top:2px;font-size:.85rem}

  .rule{display:flex;align-items:center;justify-content:center;gap:10px;margin:16px 0;color:var(--gold)}
  .rule .ln{height:1px;width:56px;background:linear-gradient(90deg,transparent,var(--gold-soft))}
  .rule .ln.r{background:linear-gradient(270deg,transparent,var(--gold-soft))}
  .rule .orn{font-size:.95rem}

  .intro{text-align:center;max-width:400px;margin:0 auto;font-family:'Frank Ruhl Libre',serif;font-weight:300;font-size:1rem;line-height:1.55;color:var(--ink)}

  form{display:flex;flex-direction:column;gap:15px;margin-top:20px}
  .field label{display:block;font-family:'Frank Ruhl Libre',serif;font-size:1rem;color:var(--ink);margin-bottom:6px}
  input[type=text]{
    width:100%;padding:11px 14px;
    font-family:'Heebo',sans-serif;font-size:1rem;color:var(--ink);
    background:var(--field);
    border:1px solid var(--paper-line);border-radius:2px;
    transition:border-color .18s,box-shadow .18s;
  }
  input[type=text]::placeholder{color:#a7ac9a}
  input[type=text]:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(176,141,79,.12)}

  .attend{display:flex;gap:10px}
  .attend button{
    flex:1;padding:12px 8px;
    font-family:'Heebo',sans-serif;font-size:.98rem;font-weight:500;
    background:var(--field);border:1px solid var(--paper-line);border-radius:2px;
    color:var(--ink-soft);cursor:pointer;transition:all .2s;
  }
  .attend button:hover{border-color:var(--leaf);color:var(--ink)}
  .attend button.sel[data-v="yes"]{background:var(--yes);border-color:var(--yes);color:#fff}
  .attend button.sel[data-v="no"]{background:var(--no);border-color:var(--no);color:#fff}

  .party{max-height:0;overflow:hidden;transition:max-height .3s ease}
  .party.show{max-height:120px}
  .counter{display:flex;align-items:center;gap:18px}
  .counter button{
    width:42px;height:42px;font-size:1.3rem;
    background:var(--field);border:1px solid var(--paper-line);border-radius:2px;
    color:var(--gold);cursor:pointer;transition:all .18s;
  }
  .counter button:hover{border-color:var(--gold);background:rgba(176,141,79,.08)}
  .counter .num{font-family:'Frank Ruhl Libre',serif;font-size:1.5rem;min-width:30px;text-align:center;color:var(--ink)}

  .submit{
    margin-top:2px;padding:14px;
    font-family:'Heebo',sans-serif;font-size:1rem;font-weight:500;letter-spacing:.03em;
    background:linear-gradient(180deg,var(--gold-soft),var(--gold));
    color:#332612;border:none;border-radius:2px;cursor:pointer;
    transition:filter .18s,transform .05s;
  }
  .submit:hover{filter:brightness(1.06)}
  .submit:active{transform:translateY(1px)}
  .submit:disabled{opacity:.4;cursor:not-allowed;filter:none}
  .note{font-size:.76rem;color:var(--ink-soft);text-align:center;opacity:.85}

  .done{text-align:center;padding:8px 0}
  .done .mark{color:var(--leaf);font-size:1.7rem;margin-bottom:6px}
  .done h2{font-family:'Frank Ruhl Libre',serif;font-weight:400;font-size:1.45rem;margin-bottom:8px;color:var(--ink)}
  .done p{color:var(--ink-soft);margin-bottom:6px}

  @media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="card">
  <div class="pad">
    <div id="formArea">
      <div class="crest">❦ <span class="sm">✿</span> ❦</div>
      <div class="eyebrow">יחד עם משפחותיהם</div>
      <div class="of">לחתונה של</div>
      <div class="names">
        <span class="n">ולד</span><span class="amp">&</span><span class="n">אלכסנדרה</span>
      </div>
      <div class="meta">יום רביעי<span class="dot"></span>14 באוקטובר 2026</div>
      <div class="meta" style="font-size:.95rem;margin-top:2px">דרזנר, פתח תקווה</div>
      <div class="heart">♥</div>

      <div class="rule"><span class="ln"></span><span class="orn">❁</span><span class="ln r"></span></div>

      <p class="intro">אז זהו, אנחנו עושים את זה! מוזמנים לחגוג איתנו — נשמח שתאשרו הגעה.</p>

      <form id="rsvpForm" action="https://formspree.io/f/mjyvowyg" method="POST">
        <div class="field">
          <label for="name">השם שלכם</label>
          <input type="text" id="name" name="שם" placeholder="שם פרטי ומשפחה" autocomplete="name" required>
        </div>
        <div class="field">
          <label>האם תגיעו לחגוג איתנו?</label>
          <div class="attend">
            <button type="button" data-v="yes">בשמחה רבה</button>
            <button type="button" data-v="no">לצערי לא אוכל</button>
          </div>
          <input type="hidden" name="הגעה" id="attendInput">
        </div>
        <div class="field party" id="partyField">
          <label>כמה אורחים בסך הכול?</label>
          <div class="counter">
            <button type="button" id="minus">−</button>
            <span class="num" id="count">1</span>
            <button type="button" id="plus">+</button>
          </div>
          <input type="hidden" name="מספר_אורחים" id="partyInput" value="1">
        </div>
        <input type="hidden" name="_subject" value="אישור הגעה חדש — חתונת ולד ואלכסנדרה">
        <button type="submit" class="submit" id="submitBtn" disabled>שליחת אישור הגעה</button>
        <p class="note">תודה! נשמח לראותכם ב-14.10</p>
      </form>
    </div>

    <div id="doneArea" style="display:none">
      <div class="crest">✦</div>
      <div class="done">
        <h2 id="doneTitle">תודה</h2>
        <p id="doneMsg"></p>
        <div class="rule"><span class="ln"></span><span class="orn">❁</span><span class="ln r"></span></div>
        <p style="font-family:'Frank Ruhl Libre',serif;font-size:1.1rem;color:var(--ink)">ולד &amp; אלכסנדרה</p>
      </div>
    </div>
  </div>
</div>

<script>
let attending=null, party=1;
const attendBtns=document.querySelectorAll('.attend button');
const partyField=document.getElementById('partyField');
const countEl=document.getElementById('count');
const submitBtn=document.getElementById('submitBtn');
const attendInput=document.getElementById('attendInput');
const partyInput=document.getElementById('partyInput');

attendBtns.forEach(b=>{
  b.addEventListener('click',()=>{
    attendBtns.forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel');
    attending=b.dataset.v;
    attendInput.value = attending==='yes' ? 'מגיע/ה' : 'לא מגיע/ה';
    partyField.classList.toggle('show',attending==='yes');
    partyInput.value = attending==='yes' ? party : 0;
    validate();
  });
});
document.getElementById('plus').onclick=()=>{if(party<12){party++;countEl.textContent=party;partyInput.value=party}};
document.getElementById('minus').onclick=()=>{if(party>1){party--;countEl.textContent=party;partyInput.value=party}};
document.getElementById('name').addEventListener('input',validate);
function validate(){
  const name=document.getElementById('name').value.trim();
  submitBtn.disabled=!(name&&attending);
}

document.getElementById('rsvpForm').addEventListener('submit',async(e)=>{
  e.preventDefault();
  const form=e.target;
  const name=document.getElementById('name').value.trim();
  submitBtn.disabled=true;
  submitBtn.textContent='שולח…';
  try{
    const res=await fetch(form.action,{
      method:'POST',
      body:new FormData(form),
      headers:{'Accept':'application/json'}
    });
    if(res.ok){ showDone(name); }
    else{ throw new Error('formspree error'); }
  }catch(err){
    submitBtn.disabled=false;
    submitBtn.textContent='שליחת אישור הגעה';
    alert('משהו השתבש בשליחה. נסו שוב, או בדקו חיבור אינטרנט.');
  }
});

function showDone(name){
  document.getElementById('formArea').style.display='none';
  document.getElementById('doneArea').style.display='block';
  document.getElementById('doneTitle').textContent = attending==='yes' ? 'מחכים בקוצר רוח' : 'נתגעגע אליכם';
  document.getElementById('doneMsg').textContent = attending==='yes'
    ? `${name}, אתם רשומים${party>1?` (${party} אורחים)`:''}. נתראה ב-14 באוקטובר.`
    : `תודה שהודעתם לנו, ${name}. תהיו איתנו בלב.`;
}
</script>
</body>
</html>
